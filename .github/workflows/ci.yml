name: CODEFORGE AI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeforge-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Python core
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python sources
        run: python -m compileall -q app tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
